<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Export PDF de la documentation</title>
    <!--
        Outil d'export : assemble des fichiers Markdown de docs/ et dessine les diagrammes Mermaid,
        puis Chrome en mode headless imprime la page en PDF (voir docs/outils/exporter-pdf.sh).
        Exemple : export-pdf.html?titre=Documentation%20technique&docs=../technique/03-mcd.md,../technique/04-diagramme-de-classes.md
    -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <style>
        @page { size: A4; margin: 16mm 14mm; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #1f2a20; max-width: 180mm; margin: 0 auto; }
        h1, h2, h3 { font-family: Georgia, serif; color: #2c4a2e; }
        h1 { font-size: 22pt; border-bottom: 3px solid #c4973a; padding-bottom: 6px; break-before: page; }
        section:first-of-type h1, .couverture + section h1 { break-before: auto; }
        h2 { font-size: 15pt; margin-top: 1.6em; }
        h3 { font-size: 12pt; }
        table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 9.5pt; break-inside: avoid; }
        th, td { border: 1px solid #c9c2b0; padding: 5px 7px; text-align: left; vertical-align: top; }
        th { background: #f3efe4; }
        code { background: #f3efe4; padding: 1px 4px; border-radius: 3px; font-size: 9.5pt; }
        pre { background: #f7f5ef; padding: 10px; border-radius: 4px; overflow: hidden; white-space: pre-wrap; font-size: 9pt; break-inside: avoid; }
        pre.mermaid { background: none; text-align: center; }
        pre.mermaid svg { max-width: 100%; height: auto; }
        img { max-width: 100%; }
        .couverture { height: 250mm; display: flex; flex-direction: column; justify-content: center; text-align: center; break-after: page; }
        .couverture h1 { border: none; font-size: 30pt; break-before: auto; }
        .couverture p { font-size: 13pt; color: #555; }
    </style>
</head>
<body>
    <div id="contenu">Chargement…</div>

    <script>
        (async () => {
            const parametres = new URLSearchParams(location.search);
            const fichiers = (parametres.get('docs') || '').split(',').filter(Boolean);
            const titre = parametres.get('titre');

            let html = '';
            if (titre) {
                html += `<div class="couverture"><h1>${titre}</h1><p>Vite &amp; Gourmand — application de restauration événementielle</p>`
                    + `<p>Carla Ferrero — ECF Développeur Web et Web Mobile — ${new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</p></div>`;
            }
            const sections = [];
            for (const fichier of fichiers) {
                const markdown = await (await fetch(fichier)).text();
                sections.push({ fichier, html: marked.parse(markdown) });
            }

            const contenu = document.getElementById('contenu');
            contenu.innerHTML = html;

            // Chaque section garde ses images relatives au dossier de son fichier Markdown
            for (const section of sections) {
                const element = document.createElement('section');
                element.innerHTML = section.html;
                const base = new URL(section.fichier, location.href);
                element.querySelectorAll('img').forEach(image => {
                    image.src = new URL(image.getAttribute('src'), base).href;
                });
                contenu.appendChild(element);
            }
            await Promise.all([...contenu.querySelectorAll('img')].map(image =>
                image.complete ? null : new Promise(fin => { image.onload = image.onerror = fin; })));

            // Les blocs ```mermaid deviennent des diagrammes
            contenu.querySelectorAll('code.language-mermaid').forEach(code => {
                const bloc = document.createElement('pre');
                bloc.className = 'mermaid';
                bloc.textContent = code.textContent;
                code.parentElement.replaceWith(bloc);
            });

            mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { useMaxWidth: true }, er: { useMaxWidth: true } });
            await mermaid.run();
            document.title = titre || 'Documentation';
            document.body.dataset.pret = 'oui';
        })();
    </script>
</body>
</html>
