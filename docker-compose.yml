services:
  app:
    build: .
    container_name: vg_app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-vite_gourmand}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-none}
      MAIL_FROM: ${MAIL_FROM:-noreply@vite-gourmand.fr}
      MAIL_CONTACT: ${MAIL_CONTACT:-contact@vite-gourmand.fr}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - vg_network

  # Serveur mail de test : intercepte tous les e-mails envoyés en local (interface web sur le port 8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: vg_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - vg_network

  mysql:
    image: mysql:8.0
    container_name: vg_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/create.sql:/docker-entrypoint-initdb.d/1-create.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vg_network

  mongo:
    image: mongo:7
    container_name: vg_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vg_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vg_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - vg_network

volumes:
  mysql_data:
  mongo_data:

networks:
  vg_network:
    driver: bridge
    